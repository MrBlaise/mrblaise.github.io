<!-- /favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BR">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#FF3CAC"/>
    </linearGradient>
  </defs>

  <!-- Badge: proportions aligned with header badge look -->
  <rect x="6" y="6" width="52" height="52" rx="20" fill="url(#g)" />
  <!-- Subtle inner border like the header -->
  <rect x="6" y="6" width="52" height="52" rx="20" fill="none" stroke="rgba(255,255,255,0.18)" />

  <!-- Monogram -->
  <text x="32" y="40" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-weight="700" font-size="24" fill="#ffffff"
        style="letter-spacing:-0.5px">BR</text>
</svg>
